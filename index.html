<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ماشین‌حساب مهندسی نوید</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #2c3e50; }
        .calculator { background-color: #34495e; padding: 20px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); width: 320px; }
        #display { width: 100%; height: 50px; font-size: 24px; text-align: left; margin-bottom: 10px; padding: 10px; border-radius: 5px; border: none; box-sizing: border-box; background: #ecf0f1; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 15px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; background: #95a5a6; color: white; transition: 0.2s; }
        button:hover { background: #7f8c8d; }
        button.op { background: #e67e22; }
        button.op:hover { background: #d35400; }
        button.equal { background: #27ae60; grid-column: span 2; }
        button.equal:hover { background: #219150; }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
        <button onclick="clearDisplay()">C</button>
        <button onclick="appendToDisplay('Math.sin(')">sin</button>
        <button onclick="appendToDisplay('Math.cos(')">cos</button>
        <button onclick="appendToDisplay('/')">/</button>
        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button onclick="appendToDisplay('*')">×</button>
        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button onclick="appendToDisplay('-')">-</button>
        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button onclick="appendToDisplay('+')">+</button>
        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="appendToDisplay('.')">.</button>
        <button onclick="appendToDisplay('Math.sqrt(')">√</button>
        <button onclick="appendToDisplay('**')">^</button>
        <button onclick="appendToDisplay(')')">)</button>
        <button onclick="appendToDisplay('(')">(</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');
    function appendToDisplay(value) { display.value += value; }
    function clearDisplay() { display.value = ''; }
    function calculate() {
        try { display.value = eval(display.value); }
        catch (error) { display.value = 'خطا!'; }
    }
</script>

</body>
</html>
